# =========================================================
# API GATEWAY — ZENTRIX CLOUD NATIVE
# =========================================================
# Punto de entrada único para todos los microservicios.
#
# Arquitectura:
# Frontend
#    ↓
# API Gateway
#    ↓
# ms-users
# ms-products
# ms-orders
#
# =========================================================

server:
  # =========================================================
  # CLOUD RUN
  # =========================================================
  # Cloud Run inyecta automáticamente PORT.
  #
  # LOCAL:
  # usa 8080 si PORT no existe.
  # =========================================================
  port: ${PORT:8080}

spring:

  # =========================================================
  # IMPORTANTE — WEBFLUX
  # =========================================================
  # Spring Cloud Gateway funciona con WebFlux.
  #
  # Esto evita conflictos con Tomcat tradicional
  # y mejora compatibilidad con Cloud Run.
  # =========================================================
  main:
    web-application-type: reactive

  cloud:

    gateway:

      # =========================================================
      # DESACTIVAR JSON → GRPC
      # =========================================================
      # Evita errores internos:
      #
      # ClassNotFoundException:
      # io.grpc.netty.NettyChannelBuilder
      #
      # NO usamos GRPC.
      # =========================================================
      filter:
        json-to-grpc:
          enabled: false

      # =========================================================
      # FILTROS GLOBALES
      # =========================================================
      # DedupeResponseHeader elimina headers CORS duplicados
      # que puedan venir del backend (ms-users tiene su propio CORS).
      # El WebFilter CorsWebFilter.java maneja CORS a nivel gateway.
      # =========================================================
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Allow-Credentials, RETAIN_FIRST

      # =========================================================
      # RUTAS MICROSERVICIOS
      # =========================================================
      routes:

        # =====================================================
        # AUTH
        # =====================================================
        - id: ms-auth
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/auth/**

        # =====================================================
        # USERS
        # =====================================================
        - id: ms-users
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/users/**

        # =====================================================
        # TENANTS
        # =====================================================
        - id: ms-tenants
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/tenants/**

        # =====================================================
        # CLIENTS
        # =====================================================
        - id: ms-clients
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/clients/**

        # =====================================================
        # INVENTORY
        # =====================================================
        - id: ms-inventory
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/inventory/**

        # =====================================================
        # SUPPLIERS
        # =====================================================
        - id: ms-suppliers
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/suppliers/**

        # =====================================================
        # PAYMENTS
        # =====================================================
        - id: ms-payments
          uri: ${GATEWAY_MS_USERS_URI}
          predicates:
            - Path=/payments/**

        # =====================================================
        # PRODUCTS
        # =====================================================
        - id: ms-products
          uri: ${GATEWAY_MS_PRODUCTS_URI}
          predicates:
            - Path=/products/**,/images/**

        # =====================================================
        # ORDERS
        # =====================================================
        - id: ms-orders
          uri: ${GATEWAY_MS_ORDERS_URI}
          predicates:
            - Path=/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO