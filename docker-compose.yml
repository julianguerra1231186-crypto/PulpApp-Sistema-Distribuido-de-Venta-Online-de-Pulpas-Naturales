# =========================================================
# Docker Compose — Zentrix SaaS (Desarrollo Local)
# =========================================================
# Este archivo está configurado para DESARROLLO LOCAL.
# Usa el contenedor postgres local (NO la IP de Cloud SQL).
#
# Para producción/cloud, cada microservicio se despliega
# individualmente en Cloud Run con sus propias variables
# de entorno (SPRING_DATASOURCE_URL apuntando a Cloud SQL).
#
# USO:
#   docker compose up --build
#   docker compose down -v   (elimina volúmenes)
#
# PUERTOS EXPUESTOS AL HOST:
#   - Frontend:     http://localhost:3000
#   - API Gateway:  http://localhost:8090
#   - pgAdmin:      http://localhost:5050
#   - PostgreSQL:   localhost:5434 (para herramientas externas)
# =========================================================

services:

  # ── Base de Datos ──────────────────────────────────────
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: pulpapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulpapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulpapp-network

  # ── pgAdmin (opcional, para administración visual) ─────
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulpapp-network

  # ── Microservicio: Usuarios ────────────────────────────
  ms-users:
    build:
      context: ./ms-users
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulpapp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      PORT: 8081
      UPLOADS_DIR: /app/uploads/cv
    volumes:
      - cv_uploads:/app/uploads/cv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - pulpapp-network

  # ── Microservicio: Productos ───────────────────────────
  ms-products:
    build:
      context: ./ms-products
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulpapp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      PORT: 8082
      APP_BASE_URL: http://localhost:8090
      APP_UPLOAD_DIR: /app/uploads/products
      JWT_SECRET: ${JWT_SECRET:-cGVwcGVyTWludFB1bHBBcHBTZWNyZXRLZXkyMDI2IVhZWg==}
      TENANT_DEFAULT_ID: ${TENANT_DEFAULT_ID:-1}
    volumes:
      - product_images:/app/uploads/products
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - pulpapp-network

  # ── Microservicio: Órdenes ─────────────────────────────
  ms-orders:
    build:
      context: ./ms-orders
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      ms-products:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulpapp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      PORT: 8083
      MS_PRODUCTS_BASE_URL: http://ms-products:8082
      MS_USERS_BASE_URL: http://ms-users:8081
      JWT_SECRET: ${JWT_SECRET:-cGVwcGVyTWludFB1bHBBcHBTZWNyZXRLZXkyMDI2IVhZWg==}
      TENANT_DEFAULT_ID: ${TENANT_DEFAULT_ID:-1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - pulpapp-network

  # ── API Gateway ────────────────────────────────────────
  # Punto de entrada HTTP único.
  # Host 8090 -> container 8080 (evita conflicto con puerto 8080 del host)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      ms-users:
        condition: service_started
      ms-products:
        condition: service_started
      ms-orders:
        condition: service_started
    environment:
      PORT: 8080
      GATEWAY_MS_USERS_URI: http://ms-users:8081
      GATEWAY_MS_PRODUCTS_URI: http://ms-products:8082
      GATEWAY_MS_ORDERS_URI: http://ms-orders:8083
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - pulpapp-network

  # ── Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:8080"
    depends_on:
      - api-gateway
    networks:
      - pulpapp-network

volumes:
  postgres_data:
  cv_uploads:
  product_images:

networks:
  pulpapp-network:
    driver: bridge
