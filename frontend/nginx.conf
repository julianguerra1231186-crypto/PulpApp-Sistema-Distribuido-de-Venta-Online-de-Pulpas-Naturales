# =========================================================
# nginx.conf — Frontend Zentrix (Cloud Run + Docker)
# =========================================================
#
# PROBLEMA QUE CAUSABA EL CRASH EN CLOUD RUN:
#   El bloque "proxy_pass http://api-gateway:8080" hacía que
#   nginx intentara resolver el hostname "api-gateway" al arrancar.
#   En Cloud Run ese host NO existe → nginx falla → container crash.
#
# SOLUCIÓN:
#   Eliminar el proxy del nginx. El frontend JavaScript ya sabe
#   a qué URL llamar según el entorno (ver js/api-url.js):
#   - Cloud Run: llama directamente a https://api-gateway-xxx.run.app
#   - Docker local: llama a http://localhost:8090 (gateway expuesto)
#   - Producción: llama a la URL configurada del gateway
#
#   Nginx solo sirve archivos estáticos. Simple y estable.
#
# =========================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── HTML y JS: sin caché ─────────────────────────────
    # Garantiza que tras cada deploy se sirva la versión nueva.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ── Archivos estáticos: caché 1 día ──────────────────
    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────
    # Cualquier ruta que no sea archivo sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
