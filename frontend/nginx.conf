# =========================================================
# NGINX — Frontend Zentrix SaaS
# =========================================================
# Sirve archivos estáticos y actúa como proxy reverso
# hacia el API Gateway en Docker Compose.
#
# ENTORNOS:
#   - Docker Compose: proxy /api/ a http://api-gateway:8080
#   - Cloud Run: el JS usa URL directa del gateway (CORS)
#
# PUERTO:
#   El script docker-entrypoint.sh reemplaza LISTEN_PORT
#   con el valor de $PORT (Cloud Run) o 80 (default).
# =========================================================

server {
    listen LISTEN_PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── HTML y JS: sin caché ─────────────────────────────────
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # ── Archivos estáticos: caché de 1 día ───────────────────
    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── Ruta principal ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy al API Gateway (Docker Compose) ────────────────
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
